<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>World of Words - Bingo</title>

  <style>
    :root{
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);

      --ui-pad-x: clamp(10px, 2vw, 20px);
      --ui-pad-y: clamp(10px, 2vh, 20px);

      /* Core spacing (JS may override with px on very small screens) */
      --gap: clamp(10px, 2vw, 24px);
      --grid-gap: clamp(10px, 1.2vw, 16px);
      --ex-gap: clamp(8px, 1vw, 12px);

      --pause-w: clamp(120px, 18vw, 190px);
      --pause-h: clamp(40px, 6vw, 62px);

      --title-h: clamp(44px, 6.4vw, 86px);
      --hp-h: clamp(34px, 5vw, 62px);

      /* Board sizes (JS may override with px to fit without scroll) */
      --tile: clamp(76px, 8.6vw, 128px);
      --ex-tile: clamp(28px, 3.2vw, 46px);

      /* Answers */
      --ans-w: clamp(220px, 20vw, 320px);
      --ans-cols: 2; /* JS may set (e.g., 4~5) on small screens */
      --ans-gap: clamp(10px, 1.5vw, 16px);
      --ans-aspect: 2.4 / 1;

      /* Timer (keep inside screen by WIDTH) */
      --timer-w: clamp(260px, 72vw, 720px);
      --timer-ar-w: 918;  /* TIMEISRUNNINGOUT asset size */
      --timer-ar-h: 60;

      /* Shared typography (Bingo / Acid Rain) */
      --txt-color: rgba(255,255,255,0.95);
      --txt-shadow: 0 2px 0 rgba(0,0,0,0.65), 0 0 6px rgba(0,0,0,0.35);
      --txt-weight: 900;
      --txt-letter: -0.2px;

      /* Overlay (match Acid Rain) */
      --overlay-title-h: clamp(44px, 7vw, 96px);
      --overlay-btn-w: clamp(140px, 22vw, 220px);
      --overlay-btn-h: clamp(44px, 7vw, 70px);
    }

    html, body{
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif;
    }

    img{
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      -ms-interpolation-mode: nearest-neighbor;
      -webkit-user-drag: none;
      user-select: none;
    }

    .stage{
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .bg{
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: translateZ(0);
    }

    .ui{
      position: absolute;
      inset: 0;
      padding:
        calc(var(--ui-pad-y) + var(--safe-top))
        calc(var(--ui-pad-x) + var(--safe-right))
        calc(var(--ui-pad-y) + var(--safe-bottom))
        calc(var(--ui-pad-x) + var(--safe-left));
      pointer-events: none;

      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto; /* topbar / main / timer */
      row-gap: var(--gap);
      box-sizing: border-box;
    }

    /* clickable areas */
    .clickable{ pointer-events: auto; }

    /* Shared button base */
    .ui-btn{
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
      position: relative;
      display: inline-block;
      transition: transform 120ms ease;
      touch-action: manipulation;
      transform: translateZ(0);
      box-sizing: border-box;
    }
    .ui-btn:active{ transform: scale(0.98); }
    @media (hover:hover) and (pointer:fine){
      .ui-btn:hover{ transform: scale(1.05); }
    }

    .ui-btn .bg-img{
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
    }
    .ui-btn .label-img{
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: auto;
      height: 48%;
      max-width: 82%;
    }

    /* Top bar */
    .topbar{
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: start;
      column-gap: var(--gap);
      min-width: 0;
    }

    .pause-btn{
      width: var(--pause-w);
      height: var(--pause-h);
    }

    .title{
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-width: 0;
    }
    .title img{
      height: var(--title-h);
      width: auto;
      max-width: 92vw;
    }

    .hp{
      display: flex;
      justify-content: flex-end;
      gap: clamp(4px, 0.8vw, 10px);
      padding-top: clamp(2px, 0.3vw, 8px);
      min-width: 0;
    }
    .hp img{
      height: var(--hp-h);
      width: auto;
    }

    /* ===== Main layout (center board) ===== */
    .play-layout{
      display: grid;

      /* IMPORTANT: minmax(0, 1fr) prevents clipping due to min-content sizing */
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);

      align-items: center;
      justify-items: center;
      column-gap: var(--gap);

      min-height: 0;
      min-width: 0;
      overflow: hidden; /* we must fit without scroll */
      box-sizing: border-box;
    }

    .panel{
      display: flex;
      min-width: 0; /* prevents overflow clipping in grid columns */
      width: 100%;
    }

    .panel-example{ justify-content: flex-end; }
    .panel-main{ justify-content: center; }
    .panel-answers{ justify-content: flex-start; }

    /* ===== Example board ===== */
    #exampleBoard.ex-grid{
      display: grid;
      grid-template-columns: repeat(var(--grid-size), var(--ex-tile));
      gap: var(--ex-gap);
      justify-content: center;
      align-content: center;
      max-width: 100%;
    }

    .ex-tile{
      width: var(--ex-tile);
      height: var(--ex-tile);
      display: block;
    }

    /* ===== Main board ===== */
    #mainBoard.main-grid{
      display: grid;
      grid-template-columns: repeat(var(--grid-size), var(--tile));
      gap: var(--grid-gap);
      justify-content: center;
      align-content: center;
      max-width: 100%;
    }

    .tile{
      position: relative;
      width: var(--tile);
      height: var(--tile);
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      pointer-events: auto;
      transition: transform 120ms ease;
      touch-action: manipulation;
      transform: translateZ(0);
    }
    .tile:active{ transform: scale(0.98); }
    @media (hover:hover) and (pointer:fine){
      .tile:hover{ transform: scale(1.04); }
    }

    .tile img{
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    /* bigger text + allow line breaks */
    .tile .txt{
      position: absolute;
      inset: 10%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;
      font-weight: var(--txt-weight);
      color: var(--txt-color);
      letter-spacing: var(--txt-letter);
      text-shadow: var(--txt-shadow);

      font-size: clamp(14px, 1.55vw, 22px);
      line-height: 1.15;

      white-space: normal;
      word-break: break-word;
      overflow: hidden;
      pointer-events: none;
      min-width: 0;
    }

    .tile .txt .sub{
      display: block;
      margin-top: 0.25em;
      font-size: 0.85em;
      opacity: 0.95;
      font-weight: 700;
    }

    /* ===== Answers ===== */
    .panel-answers > #answers{
      width: min(100%, var(--ans-w));
      min-width: 0;
    }

    #answers.answers-grid{
      /* for special layouts */
      max-width: 100%;
    }

    /* If we render 10 answers as 3x3 + 1 centered, this centers the last one */
    #answers[data-cols="3"] .ans-btn.ans-single{
      grid-column: 2 / 3;
    }

    #answers.answers-grid{
      display: grid;
      grid-template-columns: repeat(var(--ans-cols), minmax(0, 1fr));
      gap: var(--ans-gap);
      width: 100%;
      align-content: center;
      justify-content: center;
      min-width: 0;
    }

    .ans-btn{
      width: 100%;
      aspect-ratio: var(--ans-aspect);
    }

    .ans-btn .label{
      position: absolute;
      inset: 14% 10%;
      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;
      font-weight: var(--txt-weight);
      color: var(--txt-color);
      letter-spacing: var(--txt-letter);
      text-shadow: var(--txt-shadow);

      font-size: clamp(14px, 1.35vw, 18px);
      line-height: 1.15;

      white-space: normal;
      word-break: break-word;
      overflow: hidden;
      pointer-events: none;
      min-width: 0;
    }

    .ans-btn[disabled]{
      cursor: default;
      opacity: 0.55;
      filter: grayscale(0.35);
      transform: none !important;
    }

    /* ===== Animations ===== */
    @keyframes tileFlash {
      0%   { filter: brightness(1); }
      50%  { filter: brightness(1.8); }
      100% { filter: brightness(1); }
    }

    @keyframes ansShake {
      0%   { transform: translateX(0); }
      25%  { transform: translateX(-4px); }
      50%  { transform: translateX(4px); }
      75%  { transform: translateX(-3px); }
      100% { transform: translateX(0); }
    }

    @keyframes ansPop {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.06); }
      100% { transform: scale(1); }
    }

    @keyframes wrongFlash {
      0%   { filter: brightness(1) saturate(1); }
      50%  { filter: brightness(1.25) saturate(1.4); }
      100% { filter: brightness(1) saturate(1); }
    }

    .tile.flash img{
      animation: tileFlash 220ms steps(2, end) 1;
    }

    .ans-btn.is-correct{
      animation: ansPop 180ms ease-out 1;
    }

    .ans-btn.is-wrong{
      animation: ansShake 260ms steps(2, end) 1;
    }
    .ans-btn.is-wrong .bg-img{
      animation: wrongFlash 260ms steps(2, end) 1;
    }

    /* ===== Timer (fit by WIDTH) ===== */
    .timer-bar{
      display: grid;
      justify-items: center;
      padding-bottom: max(10px, var(--safe-bottom));
      pointer-events: none;
      min-width: 0;
    }

    .timer-wrap{
      position: relative;
      width: var(--timer-w);
      aspect-ratio: var(--timer-ar-w) / var(--timer-ar-h);
    }

    .timer-img{
      width: 100%;
      height: 100%;
      display: block;
      object-fit: fill;
    }

    .timer-mask{
      position: absolute;
      top: 0;
      right: 0;
      height: 100%;
      width: 0%;
      overflow: hidden;
    }
    .timer-mask .timer-img{
      position: absolute;
      top: 0;
      right: 0;
      width: var(--timer-w); /* keep full image size; mask only clips */
      height: 100%;
    }

    /* Overlay (match Acid Rain) */
    .overlay{
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(2px);
      z-index: 50;
      pointer-events: auto;
    }
    .overlay.show{ display: flex; }

    .overlay-inner{
      width: min(92vw, 720px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(14px, 2.8vw, 28px);
      pointer-events: none;
    }

    .overlay-title-img{
      height: var(--overlay-title-h);
      width: auto;
      max-width: 90vw;
      object-fit: contain;
    }

    .overlay-title-text{
      display: none;
      font-weight: 900;
      letter-spacing: -0.3px;
      color: #fff;
      text-shadow: 0 2px 0 rgba(0,0,0,0.35);
      text-align: center;
      font-size: clamp(22px, 5vw, 44px);
      line-height: 1.1;
    }

    .overlay-actions{
      display: flex;
      gap: clamp(14px, 2.8vw, 28px);
      justify-content: center;
      align-items: center;
      width: 100%;
      pointer-events: none;
    }

    .overlay-btn{
      width: var(--overlay-btn-w);
      height: var(--overlay-btn-h);
      pointer-events: auto;
    }

    .overlay-btn .bg-img{
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      filter: drop-shadow(0 2px 0 rgba(0,0,0,0.25));
    }

    .overlay-btn .label-img{
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      height: 52%;
      max-width: 80%;
    }

    @media (max-width: 420px){
      .overlay-actions{ flex-direction: column; }
    }

    /* ===== Responsive: stack vertically (NO SCROLL) ===== */
    @media (max-width: 900px), (orientation: portrait){
      :root{
        /* Safer defaults BEFORE JS runs (prevents "momentary clipping") */
        --tile: clamp(44px, min(13.8vw, 8.4vh), 72px);
        --ex-tile: clamp(14px, min(5.6vw, 3.4vh), 26px);

        --grid-gap: clamp(6px, 1.2vw, 10px);
        --ex-gap: clamp(4px, 1vw, 8px);

        /* Answers: smaller buttons + more breathing room */
        --ans-cols: 3;
        --ans-w: min(92vw, 440px);
        --ans-gap: clamp(12px, 2.2vw, 18px);
        --ans-aspect: 2.8 / 1;

        /* Timer always inside screen */
        --timer-w: min(92vw, 560px);
      }

      .play-layout{
        grid-template-columns: 1fr;
        row-gap: var(--gap);
        align-content: start;
        overflow: hidden; /* keep: no scroll */
      }

      .panel{
        justify-content: center !important;
      }

      .panel-answers > #answers{
        width: min(100%, var(--ans-w));
      }
    }
  </style>
</head>

<body>
  <div class="stage">
    <img class="bg" src="assets/world_of_words_game_Background_For_Desktop.png" alt="" />

    <div class="ui" aria-label="Bingo gameplay">
      <!-- Top bar -->
      <div class="topbar">
        <button class="ui-btn pause-btn clickable" id="pauseBtn" aria-label="Pause">
          <img class="bg-img" src="assets/Button_Pause.png" alt="" />
          <img class="label-img" src="assets/PAUSE.png" alt="PAUSE" />
        </button>

        <div class="title">
          <img src="assets/Bingo_Title.png" alt="BINGO" />
        </div>

        <div class="hp" id="hp" aria-label="HP"></div>
      </div>

      <!-- Main layout -->
      <div class="play-layout">
        <section class="panel panel-example">
          <div id="exampleBoard" class="ex-grid" aria-label="Pattern preview"></div>
        </section>

        <section class="panel panel-main">
          <div id="mainBoard" class="main-grid" aria-label="Bingo board"></div>
        </section>

        <section class="panel panel-answers">
          <div id="answers" class="answers-grid" aria-label="Answer choices"></div>
        </section>
      </div>

      <!-- Timer bottom -->
      <div class="timer-bar">
        <div class="timer-wrap">
          <img class="timer-img" src="assets/TIMEISRUNNINGOUT_Red.png" alt="" onerror="this.onerror=null;this.src='assets/TIMEISRUNNINGOUT_White.png';" />
          <div id="timerMask" class="timer-mask">
            <img class="timer-img" src="assets/TIMEISRUNNINGOUT_Black.png" alt="" />
          </div>
        </div>
      </div>

      <!-- Overlays (match Acid Rain) -->
      <div class="overlay" id="overlay" aria-hidden="true" data-state="pause">
        <div class="overlay-inner" role="dialog" aria-modal="true" aria-label="Game dialog">
          <img class="overlay-title-img" id="overlayTitleImg" alt="" />
          <div class="overlay-title-text" id="overlayTitleText"></div>

          <div class="overlay-actions">
            <button class="ui-btn overlay-btn clickable" id="resumeBtn" type="button" aria-label="Resume">
              <img class="bg-img" src="assets/Button.png" alt="" />
              <img class="label-img" src="assets/RESUME.png" alt="RESUME" />
            </button>

            <button class="ui-btn overlay-btn clickable" id="backBtn" type="button" aria-label="Back">
              <img class="bg-img" src="assets/Button.png" alt="" />
              <img class="label-img" src="assets/BACK.png" alt="BACK" />
            </button>

            <button class="ui-btn overlay-btn clickable" id="retryBtn" type="button" aria-label="Retry">
              <img class="bg-img" src="assets/Button.png" alt="" />
              <img class="label-img" src="assets/RETRY.png" alt="RETRY" />
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- vocab sources -->
  <script src="vocab.js"></script>
  <script src="vocab-n3.js"></script>
  <script src="vocab-n2.js"></script>
  <script src="vocab-n1.js"></script>
  <script src="vocab-fr.js"></script>
  <script src="vocab-es.js"></script>

  <!-- gameplay -->
  <script src="bingo.js"></script>
</body>
</html>
