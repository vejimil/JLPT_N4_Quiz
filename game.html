<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!--
    viewport-fit=cover:
    Uses the full screen area on iPhones with a notch / home indicator.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>World of Words - Game</title>
  <link rel="stylesheet" href="./game.css" />
</head>

<body>
  <!-- =========================================================
       Full-screen stage
       - Layers: Background (bottom) + UI (top)
       ========================================================= -->
  <div class="stage">

    <!-- Desktop background image (used for all devices) -->
    <img class="bg" src="assets/world_of_words_game_Background_For_Desktop.png" alt="Background" />

    <!-- Animation layer (ghost buttons for the split morph) -->
    <div class="anim-layer" id="animLayer" aria-hidden="true"></div>

    <!-- UI overlay -->
    <div class="ui">

      <!-- =====================================================
           Back button (top-left)
           - Button background + BACK label image
           ===================================================== -->
      <div class="back-wrap">
        <button class="pix-btn" id="backBtn" aria-label="Back">
          <img class="bg-img" src="assets/Button.png" alt="" />
          <img class="label-img" src="assets/BACK.png" alt="BACK" />
        </button>
      </div>

      <!-- =====================================================
           Title (two title images)
           - aria-hidden: decorative, not interactive
           ===================================================== -->
      <div class="title" aria-hidden="true">
        <img class="line1" src="assets/The_World_Of_Words.png" alt="The World of Words" />
        <img class="line2" src="assets/Game.png" alt="Game" />
      </div>

      <!-- =====================================================
           Language buttons
           - data-lang stores the language code
           ===================================================== -->
      <div class="langs">
        <button class="lang-btn" data-lang="ja" aria-label="Japanese">
          <img class="bg-img" src="assets/Button.png" alt="" />
          <img class="label-img" src="assets/Japanese.png" alt="日本語" />
        </button>

        <button class="lang-btn" data-lang="fr" aria-label="Français">
          <img class="bg-img" src="assets/Button.png" alt="" />
          <img class="label-img" src="assets/French.png" alt="Français" />
        </button>

        <button class="lang-btn" data-lang="es" aria-label="Español">
          <img class="bg-img" src="assets/Button.png" alt="" />
          <img class="label-img" src="assets/Spanish.png" alt="Español" />
        </button>
      </div>

      <!-- =====================================================
           JLPT level selection (Japanese only, difficulty screen)
           - Phase 2: level row above the difficulty buttons.
           - No level label image assets exist, so labels are text
             overlaid on the shared Button.png background.
           - Visibility is controlled purely by CSS:
             body.difficulty-mode[data-lang="ja"] #jaLevels.
           ===================================================== -->
      <div class="ja-levels" id="jaLevels" aria-hidden="true">
        <div class="ja-level-row" role="group" aria-label="JLPT 레벨 선택">
          <button class="ja-level-btn active" data-level="n5n4" type="button">
            <img class="bg-img" src="assets/Button.png" alt="" />
            <span class="ja-level-label">N5·N4</span>
          </button>
          <button class="ja-level-btn" data-level="n3" type="button">
            <img class="bg-img" src="assets/Button.png" alt="" />
            <span class="ja-level-label">N3</span>
          </button>
          <button class="ja-level-btn" data-level="n2" type="button">
            <img class="bg-img" src="assets/Button.png" alt="" />
            <span class="ja-level-label">N2</span>
          </button>
          <button class="ja-level-btn" data-level="n1" type="button">
            <img class="bg-img" src="assets/Button.png" alt="" />
            <span class="ja-level-label">N1</span>
          </button>
        </div>
        <label class="ja-cumulative">
          <input type="checkbox" id="includeLowerLevels" />
          <span>하위 레벨 포함</span>
        </label>
      </div>

      <!-- =====================================================
           Difficulty buttons (hidden until a language is chosen)
           - Uses EASY.png / NORMAL.png / HARD.png assets
           ===================================================== -->
      <div class="diffs" id="diffs" aria-label="Difficulty selection" aria-hidden="true">
        <button class="diff-btn" data-diff="easy" aria-label="Easy">
          <img class="bg-img" src="assets/Button.png" alt="" />
          <img class="label-img" src="assets/EASY.png" alt="EASY" />
        </button>

        <button class="diff-btn" data-diff="normal" aria-label="Normal">
          <img class="bg-img" src="assets/Button.png" alt="" />
          <img class="label-img" src="assets/NORMAL.png" alt="NORMAL" />
        </button>

        <button class="diff-btn" data-diff="hard" aria-label="Hard">
          <img class="bg-img" src="assets/Button.png" alt="" />
          <img class="label-img" src="assets/HARD.png" alt="HARD" />
        </button>
      </div>

      <!-- Toast element controlled by JS -->
      <div class="toast" id="toast">Coming soon</div>

    </div>

    <!-- =========================================================
         Game pick overlay
         - Opened AFTER the user selects a difficulty.
         - Keeps your "image-only UI" rule: the two game entries are
           represented by their title assets.
         ========================================================= -->
    <!--
      NOTE (anti-flash):
      Start truly hidden with the boolean `hidden` attribute so the overlay
      never appears briefly during a hard refresh before CSS loads.
      JS will remove `hidden` when opening the overlay.
    -->
    <div class="menu-overlay" id="gamePickOverlay" aria-hidden="true" hidden>
      <div class="menu-overlay-inner" role="dialog" aria-modal="true" aria-label="Select a mini-game">
        <div class="menu-overlay-actions" aria-label="Mini-game choices">
          <button class="pick-game-btn" data-game="bingo" aria-label="Bingo">
            <img class="bg-img" src="assets/Button.png" alt="" />
            <img class="label-img" src="assets/Bingo_Title.png" alt="BINGO" />
          </button>

          <button class="pick-game-btn" data-game="acidrain" aria-label="Acid Rain">
            <img class="bg-img" src="assets/Button.png" alt="" />
            <img class="label-img" src="assets/ACID RAIN.png" alt="ACID RAIN" />
          </button>
        </div>

        <button class="pick-cancel-btn" id="gamePickCancel" aria-label="Back">
          <img class="bg-img" src="assets/Button.png" alt="" />
          <img class="label-img" src="assets/BACK.png" alt="BACK" />
        </button>
      </div>
    </div>

  </div>

  <!-- vocab sources (needed to grey-out levels that have no data yet) -->
  <script src="./vocab.js"></script>
  <script src="./vocab-n3.js"></script>
  <script src="./vocab-n2.js"></script>
  <script src="./vocab-n1.js"></script>
  <script src="./game.js"></script>
</body>
</html>
