<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>JLPT N5·N4 단어 퀴즈 | 니혼고래 🐋</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <h1 id="app-title">JLPT N5·N4 단어 퀴즈</h1>
    <div class="whale-panel">
      <div class="whale-name" id="character-name">니혼고래 🐋</div>
      <div class="whale-level">Lv. <span id="whale-level">1</span></div>
      <div class="xp-bar">
        <div class="xp-fill" id="xp-fill"></div>
      </div>
      <div class="whale-message" id="whale-message">
        일본어 바다로 떠나볼까?
      </div>
    </div>
  </header>

  <main class="main">
    <!-- 설정 영역 -->
    <section class="panel" id="setup-panel">
      <h2>시험 설정</h2>

      <!-- 언어 선택 -->
      <div class="form-row">
        <label>언어 선택</label>
        <div class="lang-buttons">
          <button
            type="button"
            class="btn lang-btn active"
            data-lang="ja"
          >
            일본어 (니혼고래 🐋)
          </button>
          <button
            type="button"
            class="btn lang-btn"
            data-lang="fr"
          >
            프랑스어 (프랑새 🐦)
          </button>
          <button
            type="button"
            class="btn lang-btn"
            data-lang="es"
          >
            스페인어 (에스파냐옹 🐱)
          </button>
        </div>
        <small class="hint">먼저 퀴즈를 풀 언어를 골라 주세요.</small>
      </div>

      <!-- JLPT 레벨 선택 (일본어 전용) -->
      <div class="form-row" id="ja-level-row">
        <label>JLPT 레벨</label>
        <div class="level-buttons">
          <button type="button" class="btn level-btn active" data-level="n5n4">
            N5·N4 (기초)
          </button>
          <button type="button" class="btn level-btn" data-level="n3">N3</button>
          <button type="button" class="btn level-btn" data-level="n2">N2</button>
          <button type="button" class="btn level-btn" data-level="n1">N1</button>
        </div>
        <label class="checkbox-row">
          <input type="checkbox" id="include-lower-levels" />
          하위 레벨 단어 포함
        </label>
        <small class="hint">출제할 레벨을 골라 주세요. 체크하면 하위 레벨 단어도 함께 나와요.</small>
      </div>

      <div class="form-row">
        <label>문항 수</label>
        <input type="number" id="question-count" min="5" max="100" value="50" />
        <small class="hint">한 번에 풀고 싶은 문제 수를 정해 주세요. (5~100)</small>
      </div>

      <div class="button-row">
        <button id="start-exam-btn" class="btn primary">
          시험 시작
        </button>
        <button id="start-wrong-btn" class="btn secondary">
          오답노트로 복습
        </button>
      </div>
      <div class="button-row">
        <button id="go-game-btn" class="btn">🎮 게임하기</button>
      </div>
    </section>

    <!-- 문제 영역 -->
    <section class="panel" id="quiz-panel" hidden>
      <div class="quiz-header">
        <div>문제 <span id="current-number">1</span> / <span id="total-number">50</span></div>
        <div>점수: <span id="current-score">0</span></div>
      </div>

      <div class="question-text" id="question-text">
        문제 텍스트
      </div>

      <div class="choices" id="choices-container">
        <!-- 보기 버튼이 JS로 들어옴 -->
      </div>

      <div class="feedback" id="feedback"></div>

      <div class="button-row center">
        <button id="check-answer-btn" class="btn primary">
          제출
        </button>
        <button id="next-question-btn" class="btn secondary" disabled>
          다음으로
        </button>
      </div>
    </section>

    <!-- 결과 영역 -->
    <section class="panel" id="result-panel" hidden>
      <h2>시험 결과</h2>
      <p>
        점수: <strong><span id="final-score">0</span> / <span id="final-total">0</span></strong>
      </p>
      <p id="result-comment"></p>

      <h3>이번 시험에서 틀린 단어</h3>
      <div id="wrong-list"></div>

      <div class="button-row center">
        <button id="retry-btn" class="btn primary">새 시험 보기</button>
        <button id="review-wrong-btn" class="btn secondary">지금까지의 오답 정리하기</button>
        <button id="end-btn" class="btn">종료하기</button>
      </div>
    </section>
  </main>

  <footer class="footer">
    <small>Made by vejimil · 니혼고래 🐋 & 프랑새 🐦 & 에스파냐옹 🐱 · ver1.3.1</small>
  </footer>


  <script src="vocab.js"></script>
  <script src="vocab-n3.js"></script>
  <script src="vocab-n2.js"></script>
  <script src="vocab-n1.js"></script>
  <script src="vocab-fr.js"></script>
  <script src="vocab-es.js"></script>
  <script src="app.js"></script>
</body>
</html>
